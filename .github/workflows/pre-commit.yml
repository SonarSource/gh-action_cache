---

on:
  pull_request:

jobs:
  pre-commit:
    name: "pre-commit"
    runs-on: sonar-xs
    env:
      VIRTUALENV_NO_PERIODIC_UPDATE: '1'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: SonarSource/ci-github-actions/config-npm@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
      - uses: SonarSource/ci-github-actions/config-pip@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          disable-caching: true
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.8.14
      - uses: SonarSource/gh-action_pre-commit@2ddc0c7fdabce0adfaaa4075a17690972ed9961a # 1.2.0
        with:
          extra-args: >
            --from-ref=origin/${{ github.event.pull_request.base.ref }}
            --to-ref=${{ github.event.pull_request.head.sha }}
