---

on:
  pull_request:

jobs:
  pre-commit:
    name: "pre-commit"
    runs-on: sonar-xs
    env:
      VIRTUALENV_NO_PERIODIC_UPDATE: '1'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: SonarSource/ci-github-actions/config-npm@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
      - uses: SonarSource/ci-github-actions/config-pip@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        with:
          disable-caching: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2025.12.13
      - uses: SonarSource/gh-action_pre-commit@ea734ef4ee748f680f3b4ac268c1ba90e245effc # 1.2.1
        with:
          extra-args: >
            --from-ref=origin/${{ github.event.pull_request.base.ref }}
            --to-ref=${{ github.event.pull_request.head.sha }}
