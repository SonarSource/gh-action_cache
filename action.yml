name: S3 Cache action
description: Cache files on S3 with branch-specific paths for granular permissions
author: SonarSource

inputs:
  operation:
    description: cache (default), upload, or download. Artifact transfers use the existing S3 backend and are scoped to this workflow run.
    default: cache
  if-no-files-found:
    description: Artifact upload policy when no files match (error, warn, or ignore)
    default: warn
  path:
    description: A list of files, directories, and wildcard patterns to cache and restore
    required: true
  key:
    description: An explicit key for restoring and saving the cache
    required: true
  restore-keys:
    description: An ordered list of prefix-matched keys to use for restoring stale cache if no cache hit occurred for key
  upload-chunk-size:
    description: The chunk size used to split up large files during upload, in bytes
  enableCrossOsArchive:
    description: When enabled, allows to save or restore caches that can be restored or saved respectively on other platforms
    default: false
  fail-on-cache-miss:
    description: Fail the workflow if cache entry is not found
    default: false
  lookup-only:
    description: Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache
    default: false
  save:
    description: >
      Allow a success-only post-job save (true or false). Set false for restore-only consumers.
      Explicit true/false opts into the producer/consumer lifecycle, logical fallback-hit reporting and single-payload restores.
      With lookup-only, true registers a save without downloading. Omit to retain the released backend behavior and output semantics.
    default: ''
  environment:
    description: Environment to use ('dev' or 'prod', 's3' backend only).
    default: prod
  fallback-branch:
    description: >
      Explicit fallback branch for restore keys (pattern 'branch-*', 's3' backend only).
      Always honoured when set, regardless of 'fallback-to-default-branch'.
      If not set, the repository default branch is used when 'fallback-to-default-branch' is true.
  fallback-to-default-branch:
    description: >
      When enabled, automatically adds a fallback restore key pointing to the default branch cache.
      Only applies to the S3 backend.
    default: 'true'
  backend:
    description: >
      Force cache backend ('github' or 's3'). If not set, falls back to the CACHE_BACKEND environment variable if defined,
      then automatically determined based on repository visibility.
  import-github-cache:
    description: >
      Import GitHub cache to S3 when no S3 cache exists (migration mode). Enabled by default when using S3 backend.
      Set to 'false' to disable, or control via the CACHE_IMPORT_GITHUB environment variable.
    default: ''

outputs:
  artifact-key:
    description: Concrete producer run/attempt key; pass it to download consumers, including on job retries
    value: ${{ steps.artifact-save.outcome == 'success' && steps.artifact-prepare.outputs.key || '' }}
  cache-hit:
    description: Backend cache-hit value. With explicit save, exact logical keys include the configured S3 fallback branch.
    value: ${{ steps.cache-outputs.outputs.cache-hit }}
  cache-found:
    description: With explicit save, whether a usable cache was found, including partial matches and probes. Empty in legacy mode.
    value: ${{ steps.cache-outputs.outputs.cache-found }}
  cache-restored:
    description: With explicit save, whether a payload was restored (false for lookup-only). Empty in legacy mode.
    value: ${{ steps.cache-outputs.outputs.cache-restored }}
  cache-matched-key:
    description: >
      The actual matched key, including its S3 branch prefix. Empty on a miss. An exact logical hit from the fallback branch
      can have a different physical key from the current branch primary key.
    value: ${{ steps.cache-outputs.outputs.matched-key }}
  restore-key-hit:
    description: >
      The restore key that was prefix-matched. Populated only when `cache-hit` is `false` AND a restore key matched (partial hit). Empty on
      exact hits and on full misses — i.e. set if this was a partial restore.
    value: ${{ steps.cache-outputs.outputs.cache-hit != 'true' && steps.cache-outputs.outputs.matched-key || '' }}
  backend:
    description: The cache backend that was actually used for this invocation (`github` or `s3`).
    value: ${{ steps.cache-backend.outputs.cache-backend }}
  cache-size-bytes:
    description: >
      Total size in bytes of the cached path(s) at restore-time. Requires GNU du (Linux); empty on other platforms.
      The action also writes a per-invocation JSON record to /tmp/ci-metrics/cache-${step}.json for the pipeline-runtime-metrics
      job-completed hook to ingest. The JSON record is written on all platforms; only the size fields are null on non-Linux.
    value: ${{ steps.cache-metrics.outputs.cache-size-bytes }}

runs:
  using: composite
  steps:
    - name: Determine cache backend and import mode
      id: cache-backend
      if: inputs.operation == 'cache'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        FORCED_BACKEND: ${{ inputs.backend }}
        INPUT_IMPORT_GITHUB_CACHE: ${{ inputs.import-github-cache }}
      run: |
        echo "::group::Resolve backend"
        BACKEND_SOURCE="auto"
        WAS_GITHUB_DEFAULT="false"
        if [[ "$FORCED_BACKEND" == "github" || "$FORCED_BACKEND" == "s3" ]]; then
          CACHE_BACKEND="$FORCED_BACKEND"
          BACKEND_SOURCE="forced"
          echo "Using forced backend from input: $CACHE_BACKEND"
        elif [[ "$CACHE_BACKEND" == "github" || "$CACHE_BACKEND" == "s3" ]]; then
          BACKEND_SOURCE="forced"
          echo "Using backend from CACHE_BACKEND environment variable: $CACHE_BACKEND"
        else
          # If visibility is not available in the event, try to get it from the API
          if [[ -z "$REPO_VISIBILITY" || "$REPO_VISIBILITY" = "null" ]]; then
            REPO_VISIBILITY=$(curl -s -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}" | \
              jq -r '.visibility // "private"')
          fi
          echo "Repository visibility: $REPO_VISIBILITY"
          CACHE_BACKEND="s3"
          if [[ "$REPO_VISIBILITY" == "public" ]]; then
            WAS_GITHUB_DEFAULT="true"
            echo "Using S3 cache for public repository (previously GitHub default — migration eligible)"
          else
            echo "Using S3 cache for private/internal repository"
          fi
        fi
        echo "::endgroup::"

        echo "::group::Resolve GitHub cache import mode"
        # Resolution order: input → CACHE_IMPORT_GITHUB env var → true if backend was explicitly forced (migration scenario)
        #                 → true if public repo switching from GitHub default → false (private/internal, already on S3)
        if [[ -n "$INPUT_IMPORT_GITHUB_CACHE" ]]; then
          IMPORT_GITHUB="$INPUT_IMPORT_GITHUB_CACHE"
          echo "Using import mode from input: $IMPORT_GITHUB"
        elif [[ -n "${CACHE_IMPORT_GITHUB:-}" ]]; then
          IMPORT_GITHUB="$CACHE_IMPORT_GITHUB"
          echo "Using import mode from CACHE_IMPORT_GITHUB environment variable: $IMPORT_GITHUB"
        elif [[ "$BACKEND_SOURCE" == "forced" ]]; then
          IMPORT_GITHUB="true"
          echo "Using default import mode (backend explicitly forced to S3 — migration scenario): $IMPORT_GITHUB"
        elif [[ "$WAS_GITHUB_DEFAULT" == "true" ]]; then
          IMPORT_GITHUB="true"
          echo "Using default import mode (public repository — previously used GitHub cache by default): $IMPORT_GITHUB"
        else
          IMPORT_GITHUB="false"
          echo "Using default import mode (private/internal repository — already on S3): $IMPORT_GITHUB"
        fi
        echo "::endgroup::"

        {
          echo "cache-backend=$CACHE_BACKEND"
          echo "backend-source=$BACKEND_SOURCE"
          echo "was-github-default=$WAS_GITHUB_DEFAULT"
          echo "import-github=$IMPORT_GITHUB"
        } >> "$GITHUB_OUTPUT"
        echo "ACTION_PATH_CACHE=${{ github.action_path }}" >> "$GITHUB_ENV"
    - name: Resolve cache lifecycle
      id: lifecycle
      if: inputs.operation == 'cache' && (inputs.save != '')
      shell: bash
      env:
        CACHE_BACKEND: ${{ steps.cache-backend.outputs.cache-backend }}
        LOOKUP_ONLY: ${{ inputs.lookup-only }}
        SAVE: ${{ inputs.save }}
        CACHE_REF: ${{ github.ref }}
      run: bash "$ACTION_PATH_CACHE/scripts/resolve-lifecycle.sh"
    - name: Cache with GitHub Actions (public repos)
      if: inputs.operation == 'cache' && (inputs.save == '' && steps.cache-backend.outputs.cache-backend == 'github')
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: github-cache
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
        upload-chunk-size: ${{ inputs.upload-chunk-size }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}
        lookup-only: ${{ inputs.lookup-only }}
    - name: Restore or probe GitHub cache
      if: inputs.operation == 'cache' && (inputs.save != '' && steps.cache-backend.outputs.cache-backend == 'github')
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: github-restore
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}
        lookup-only: ${{ inputs.lookup-only }}

    # The combined action is only a post-save registrar here. Its main step probes metadata, never extracts a second payload.
    - name: Register GitHub cache save
      if: >-
        inputs.operation == 'cache' &&
        inputs.save != '' &&
        steps.cache-backend.outputs.cache-backend == 'github' &&
        steps.lifecycle.outputs.save-enabled == 'true' &&
        steps.github-restore.outputs.cache-hit != 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: github-save
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        upload-chunk-size: ${{ inputs.upload-chunk-size }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
        lookup-only: true
    - name: Prepare artifact helper
      if: inputs.operation != 'cache'
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        ACTION_PATH_CACHE: ${{ github.action_path }}
      run: |
        case "$OPERATION" in
          upload|download) ;;
          *) echo "::error::operation must be cache, upload or download"; exit 1 ;;
        esac
        echo "ACTION_PATH_CACHE=$ACTION_PATH_CACHE" >> "$GITHUB_ENV"
        mkdir -p .actions
        ln -sfn "$ACTION_PATH_CACHE/artifact" .actions/cache-artifact

    - name: Prepare artifact
      if: inputs.operation != 'cache'
      id: artifact-prepare
      uses: ./.actions/cache-artifact
      with:
        phase: prepare
        operation: ${{ inputs.operation }}
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        if-no-files-found: ${{ inputs.if-no-files-found }}

    - name: Setup S3 cache credentials
      if: steps.artifact-prepare.outputs.ready == 'true' || (inputs.operation == 'cache' && steps.cache-backend.outputs.cache-backend == 's3')
      id: aws-auth
      uses: SonarSource/gh-action_cache/credential-setup@v1
      with:
        environment: ${{ inputs.environment }}
    - name: Prepare cache keys
      if: steps.artifact-prepare.outputs.ready == 'true' || (inputs.operation == 'cache' && steps.cache-backend.outputs.cache-backend == 's3')
      shell: bash
      id: prepare-keys
      env:
        INPUT_KEY: ${{ inputs.operation == 'cache' && inputs.key || steps.artifact-prepare.outputs.key }}
        INPUT_RESTORE_KEYS: ${{ inputs.operation == 'cache' && inputs.restore-keys || '' }}
        INPUT_FALLBACK_BRANCH: ${{ inputs.operation == 'cache' && inputs.fallback-branch || '' }}
        INPUT_FALLBACK_TO_DEFAULT_BRANCH: ${{ inputs.operation == 'cache' && inputs.fallback-to-default-branch || 'false' }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: $ACTION_PATH_CACHE/scripts/prepare-keys.sh
    - name: Upload artifact using the existing S3 backend
      if: inputs.operation == 'upload' && steps.artifact-prepare.outputs.ready == 'true'
      id: artifact-save
      uses: vdiez/runs-on-cache/save@da09dd265b45b088cb20b444a8939871dd0fa0a3 # opt-in strict S3 policies
      env:
        RUNS_ON_S3_BUCKET_CACHE: sonarsource-s3-cache-${{ inputs.environment }}-bucket
        AWS_DEFAULT_REGION: eu-central-1
        AWS_REGION: eu-central-1
        AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.AWS_SESSION_TOKEN }}
        AWS_PROFILE: ''
        AWS_DEFAULT_PROFILE: ''
      with:
        path: ${{ steps.artifact-prepare.outputs.path }}
        key: ${{ steps.prepare-keys.outputs.branch-key }}
        enableCrossOsArchive: true
        force-gzip: true
        immutable: true
        fail-on-save-error: true

    - name: Download artifact using the existing S3 backend
      if: inputs.operation == 'download'
      uses: vdiez/runs-on-cache/restore@da09dd265b45b088cb20b444a8939871dd0fa0a3 # opt-in strict S3 policies
      env:
        RUNS_ON_S3_BUCKET_CACHE: sonarsource-s3-cache-${{ inputs.environment }}-bucket
        AWS_DEFAULT_REGION: eu-central-1
        AWS_REGION: eu-central-1
        AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.AWS_SESSION_TOKEN }}
        AWS_PROFILE: ''
        AWS_DEFAULT_PROFILE: ''
      with:
        path: ${{ steps.artifact-prepare.outputs.path }}
        key: ${{ steps.prepare-keys.outputs.branch-key }}
        enableCrossOsArchive: true
        force-gzip: true
        exact-match-only: true
        fail-on-cache-miss: true

    - name: Finish artifact
      if: inputs.operation != 'cache' && steps.artifact-prepare.outputs.ready == 'true'
      uses: ./.actions/cache-artifact
      with:
        phase: finish
        operation: ${{ inputs.operation }}
        key: ${{ steps.artifact-prepare.outputs.key }}
        path: ${{ inputs.path }}

    - name: Probe S3 cache (lookup-only)
      if: inputs.operation == 'cache' && (steps.cache-backend.outputs.cache-backend == 's3')
      uses: step-security/runs-on-cache/restore@e61ed9b0206c630e9a6bb5f12ca4cd78ae7bbe93 # v5.0.8
      id: s3-probe
      env:
        RUNS_ON_S3_BUCKET_CACHE: sonarsource-s3-cache-${{ inputs.environment }}-bucket
        AWS_DEFAULT_REGION: eu-central-1
        AWS_REGION: eu-central-1
        AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.AWS_SESSION_TOKEN }}
        AWS_PROFILE: ''
        AWS_DEFAULT_PROFILE: ''
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.prepare-keys.outputs.branch-key }}
        restore-keys: ${{ steps.prepare-keys.outputs.branch-restore-keys }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
        fail-on-cache-miss: false
        lookup-only: true
    - name: Decide S3 cache mode
      if: inputs.operation == 'cache' && (inputs.save == '' && steps.cache-backend.outputs.cache-backend == 's3')
      id: s3-decide
      shell: bash
      env:
        LOOKUP_ONLY: ${{ inputs.lookup-only }}
        PROBE_HIT: ${{ steps.s3-probe.outputs.cache-hit }}
        PROBE_MATCHED_KEY: ${{ steps.s3-probe.outputs.cache-matched-key }}
        FALLBACK_EXACT_KEY: ${{ steps.prepare-keys.outputs.fallback-exact-key }}
        CACHE_REF: ${{ github.ref }}
      run: |
        echo "::group::Decide S3 cache mode"
        if [[ "$LOOKUP_ONLY" == "true" ]]; then
          MODE="lookup"
          REASON="lookup-only input set — no restore, no save"
        elif [[ "$CACHE_REF" == refs/heads/gh-readonly-queue/* ]]; then
          # Merge queue refs are not writable: the Cognito role denies s3:PutObject (and
          # s3:ListBucket) on that prefix. The save post-step can sit until the job timeout
          # after AccessDenied, so never select the combined (save-capable) action here.
          # Restore still runs and can hit the default-branch fallback key.
          MODE="restore-only"
          REASON="merge queue ref '$CACHE_REF' cannot be saved — restore without a save post-step"
          # Distinct from other restore-only paths so a miss can still import from the GitHub
          # cache and enforce fail-on-cache-miss. Those steps must not run for a fallback-exact
          # restore-only, which already has the bytes.
          echo "readonly-ref=true" >> "$GITHUB_OUTPUT"
        elif [[ "$PROBE_HIT" == "true" ]]; then
          MODE="restore-only"
          REASON="branch-scoped key already holds exact content — restore without redundant save"
        elif [[ -n "$PROBE_MATCHED_KEY" && -n "$FALLBACK_EXACT_KEY" && "$PROBE_MATCHED_KEY" == "$FALLBACK_EXACT_KEY" ]]; then
          MODE="restore-only"
          REASON="content matched the default-branch fallback-exact key — identical to default branch, skip duplicate save"
        else
          MODE="combined"
          REASON="no usable S3 match (or a non-fallback partial match) — restore and save back under the branch-scoped key"
        fi
        echo "mode=$MODE (ref='$CACHE_REF', matched-key='$PROBE_MATCHED_KEY', fallback-exact-key='$FALLBACK_EXACT_KEY'): $REASON"
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
    - name: Restore from S3 (no save)
      if: >-
        inputs.operation == 'cache' &&
        steps.cache-backend.outputs.cache-backend == 's3' &&
        ((inputs.save == '' && steps.s3-decide.outputs.mode == 'restore-only') ||
         (inputs.save != '' && inputs.lookup-only != 'true' && steps.s3-probe.outputs.cache-matched-key != ''))
      uses: step-security/runs-on-cache/restore@e61ed9b0206c630e9a6bb5f12ca4cd78ae7bbe93 # v5.0.8
      id: s3-restore
      env:
        RUNS_ON_S3_BUCKET_CACHE: sonarsource-s3-cache-${{ inputs.environment }}-bucket
        AWS_DEFAULT_REGION: eu-central-1
        AWS_REGION: eu-central-1
        AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.AWS_SESSION_TOKEN }}
        AWS_PROFILE: ''
        AWS_DEFAULT_PROFILE: ''
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.save == '' && steps.prepare-keys.outputs.branch-key || steps.s3-probe.outputs.cache-matched-key }}
        restore-keys: ${{ inputs.save == '' && steps.prepare-keys.outputs.branch-restore-keys || '' }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
        fail-on-cache-miss: ${{ inputs.save == '' && steps.cache-backend.outputs.import-github == 'true' && 'false' || inputs.fail-on-cache-miss }}
    - name: Cache on S3
      if: >-
        inputs.operation == 'cache' &&
        inputs.save == '' &&
        steps.cache-backend.outputs.cache-backend == 's3' && steps.s3-decide.outputs.mode == 'combined'
      uses: step-security/runs-on-cache@e61ed9b0206c630e9a6bb5f12ca4cd78ae7bbe93 # v5.0.8
      id: s3-cache
      env:
        RUNS_ON_S3_BUCKET_CACHE: sonarsource-s3-cache-${{ inputs.environment }}-bucket
        AWS_DEFAULT_REGION: eu-central-1
        AWS_REGION: eu-central-1
        # Step-level env: overrides GITHUB_ENV values for this step
        AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.AWS_SESSION_TOKEN }}
        # Clear profile so SDK uses env credentials, not ~/.aws/credentials
        AWS_PROFILE: ''
        AWS_DEFAULT_PROFILE: ''
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.prepare-keys.outputs.branch-key }}
        restore-keys: ${{ steps.prepare-keys.outputs.branch-restore-keys }}
        upload-chunk-size: ${{ inputs.upload-chunk-size }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
        # When import mode is active, suppress fail-on-cache-miss here: a subsequent step handles it after also attempting the GitHub cache
        # fallback.
        fail-on-cache-miss: ${{ steps.cache-backend.outputs.import-github == 'true' && 'false' || inputs.fail-on-cache-miss }}
        lookup-only: ${{ inputs.lookup-only }}
    - name: Import GitHub cache to S3 (migration fallback)
      if: >-
        inputs.operation == 'cache' &&
        steps.cache-backend.outputs.cache-backend == 's3' &&
        steps.cache-backend.outputs.import-github == 'true' &&
        (
          (inputs.save != '' && steps.s3-probe.outputs.cache-matched-key == '') ||
          (
            inputs.save == '' && steps.s3-probe.outputs.cache-hit != 'true' &&
            (
              ((steps.s3-decide.outputs.mode == 'combined' || steps.s3-decide.outputs.mode == 'lookup') &&
               steps.s3-cache.outputs.cache-hit != 'true') ||
              (steps.s3-decide.outputs.readonly-ref == 'true' && steps.s3-restore.outputs.cache-matched-key == '')
            )
          )
        )
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: github-import
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
        lookup-only: ${{ inputs.lookup-only }}
        fail-on-cache-miss: false
    - name: Enforce fail-on-cache-miss after GitHub import fallback
      if: >-
        inputs.operation == 'cache' &&
        inputs.save == '' &&
        steps.cache-backend.outputs.cache-backend == 's3' &&
        steps.cache-backend.outputs.import-github == 'true' &&
        inputs.fail-on-cache-miss == 'true' &&
        steps.s3-probe.outputs.cache-hit != 'true' &&
        steps.github-import.outputs.cache-matched-key == '' &&
        (
          (
            (steps.s3-decide.outputs.mode == 'combined' || steps.s3-decide.outputs.mode == 'lookup') &&
            steps.s3-cache.outputs.cache-hit != 'true'
          ) ||
          (
            steps.s3-decide.outputs.readonly-ref == 'true' &&
            steps.s3-restore.outputs.cache-matched-key == ''
          )
        )
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.key }}
      run: |
        echo "::error::Cache miss: no cache found in S3 or GitHub for key '${CACHE_KEY}'"
        exit 1

    # Resolve public outputs once for both callers and metrics, retaining released precedence when save is omitted.
    - name: Resolve cache outputs
      if: inputs.operation == 'cache'
      id: cache-outputs
      shell: bash
      env:
        SAVE: ${{ inputs.save }}
        HIT_S3: ${{ steps.s3-cache.outputs.cache-hit }}
        MATCHED_S3: ${{ steps.s3-cache.outputs.cache-matched-key }}
        HIT_S3_RESTORE: ${{ steps.s3-restore.outputs.cache-hit }}
        HIT_S3_PROBE: ${{ steps.s3-probe.outputs.cache-hit }}
        CACHE_BACKEND: ${{ steps.cache-backend.outputs.cache-backend }}
        LOOKUP_ONLY: ${{ inputs.lookup-only }}
        BRANCH_KEY: ${{ steps.prepare-keys.outputs.branch-key }}
        FALLBACK_EXACT_KEY: ${{ steps.prepare-keys.outputs.fallback-exact-key }}
        MATCHED_GITHUB: ${{ inputs.save != '' && steps.github-restore.outputs.cache-matched-key || steps.github-cache.outputs.cache-matched-key }}
        HIT_GITHUB: ${{ inputs.save != '' && steps.github-restore.outputs.cache-hit || steps.github-cache.outputs.cache-hit }}
        MATCHED_S3_PROBE: ${{ steps.s3-probe.outputs.cache-matched-key }}
        MATCHED_S3_RESTORE: ${{ steps.s3-restore.outputs.cache-matched-key }}
        MATCHED_IMPORT: ${{ steps.github-import.outputs.cache-matched-key }}
        HIT_IMPORT: ${{ steps.github-import.outputs.cache-hit }}
      run: bash "$ACTION_PATH_CACHE/scripts/cache-outputs.sh"
    - name: Enforce fail-on-cache-miss
      if: >-
        inputs.operation == 'cache' &&
        inputs.save != '' &&
        inputs.fail-on-cache-miss == 'true' && steps.cache-outputs.outputs.cache-found != 'true'
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.key }}
      run: |
        echo "::error::Cache miss: no usable cache found for key '${CACHE_KEY}'"
        exit 1
    - name: Register S3 cache save
      if: >-
        inputs.operation == 'cache' &&
        inputs.save != '' &&
        steps.cache-backend.outputs.cache-backend == 's3' &&
        steps.lifecycle.outputs.save-enabled == 'true' &&
        steps.s3-probe.outputs.cache-matched-key != steps.prepare-keys.outputs.branch-key &&
        (steps.prepare-keys.outputs.fallback-exact-key == '' ||
         steps.s3-probe.outputs.cache-matched-key != steps.prepare-keys.outputs.fallback-exact-key)
      uses: vdiez/runs-on-cache@da09dd265b45b088cb20b444a8939871dd0fa0a3 # opt-in immutable S3 publication
      id: s3-save
      env:
        RUNS_ON_S3_BUCKET_CACHE: sonarsource-s3-cache-${{ inputs.environment }}-bucket
        AWS_DEFAULT_REGION: eu-central-1
        AWS_REGION: eu-central-1
        # Step-level env: overrides GITHUB_ENV values for this step
        AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.AWS_SESSION_TOKEN }}
        # Clear profile so SDK uses env credentials, not ~/.aws/credentials
        AWS_PROFILE: ''
        AWS_DEFAULT_PROFILE: ''
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.prepare-keys.outputs.branch-key }}
        upload-chunk-size: ${{ inputs.upload-chunk-size }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
        fail-on-cache-miss: false
        lookup-only: true
        immutable: true
    - name: Resolve CI metrics gate
      id: ci-metrics-gate
      if: inputs.operation == 'cache' && (runner.os == 'Linux' || env.CI_METRICS_ENABLED == 'true')
      shell: bash
      run: |
        echo "::group::CI metrics gate"
        CI_METRICS_DIR="${CI_METRICS_DIR:-/tmp/ci-metrics}"
        case "${CI_METRICS_ENABLED:-}" in
          true)
            mkdir -p "$CI_METRICS_DIR"
            : > "$CI_METRICS_DIR/enabled"
            decision=true
            reason="Metrics enabled: workflow-env-true (touched $CI_METRICS_DIR/enabled for post-job hook)"
            ;;
          false)
            rm -f "$CI_METRICS_DIR/enabled"
            decision=false
            reason="Metrics disabled: workflow-env-false (removed $CI_METRICS_DIR/enabled)"
            ;;
          *)
            if [[ -e "$CI_METRICS_DIR/enabled" ]]; then
              decision=true
              reason="Metrics enabled: runner-side decision file present at $CI_METRICS_DIR/enabled"
            else
              decision=false
              reason="Metrics disabled: no signal (CI_METRICS_ENABLED unset and $CI_METRICS_DIR/enabled absent)"
            fi
            ;;
        esac
        echo "$reason"
        echo "decision=$decision" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
    - name: Prepare local cache-metrics sub-action
      id: cache-metrics-prep
      if: inputs.operation == 'cache' && (steps.ci-metrics-gate.outputs.decision == 'true')
      shell: bash
      # Fail-open: the metrics flow must never break the cache flow. The next step's `if:` will skip gracefully if preparation fails.
      run: |
        echo "::group::Prepare .actions/cache-metrics symlink"
        set +e
        ACTION_PATH_CACHE="${{ github.action_path }}"
        echo "github.action_path=$ACTION_PATH_CACHE"
        mkdir -p .actions
        ln -sf "$ACTION_PATH_CACHE/cache-metrics" .actions/cache-metrics
        ls -la .actions/*
        if [ ! -e .actions/cache-metrics/action.yml ]; then
          echo "::warning::cache-metrics: could not prepare .actions/cache-metrics symlink — skipping metrics."
          echo "prepared=false" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          exit 0
        fi
        echo "prepared=true" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
        exit 0
    - name: Emit cache metrics (size + saved)
      if: inputs.operation == 'cache' && (steps.cache-metrics-prep.outputs.prepared == 'true')
      id: cache-metrics
      uses: ./.actions/cache-metrics
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        cache-hit: ${{ steps.cache-outputs.outputs.cache-hit }}
        matched-key: ${{ steps.cache-outputs.outputs.matched-key }}
        backend: ${{ steps.cache-backend.outputs.cache-backend }}
        lookup-only: ${{ inputs.lookup-only }}
        step-id: ${{ github.action }}
        mode: ${{ steps.s3-decide.outputs.mode }}
        save-enabled: ${{ inputs.save != '' && ((steps.github-save.outcome == 'success' || steps.s3-save.outcome == 'success') && 'true' || 'false') || '' }}
    - name: Credential guard for S3 cache save
      if: inputs.operation == 'cache' && (steps.cache-backend.outputs.cache-backend == 's3' && (inputs.save == '' || steps.s3-save.outcome == 'success'))
      uses: SonarSource/gh-action_cache/credential-guard@v1
      with:
        credentials-file: ${{ steps.aws-auth.outputs.credentials-file }}

    # Must be the LAST main step so its post fires FIRST in the LIFO post phase: it recreates `.actions/cache-metrics` before
    # cache-metrics-post resolves `uses: ./.actions/cache-metrics`, surviving destruction by an external action between cache-metrics-main
    # and cache-metrics-post.
    - name: Symlink keeper (preserve .actions/cache-metrics across nested checkouts)
      if: inputs.operation == 'cache' && (steps.cache-metrics-prep.outputs.prepared == 'true')
      uses: SonarSource/gh-action_cache/symlink-keeper@symlink-keeper-1.0.0
      with:
        cache-metrics-action-path: ${{ format('{0}/cache-metrics', github.action_path) }}

branding:
  icon: upload-cloud
  color: blue
