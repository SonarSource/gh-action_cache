name: Artifact packaging
description: Internal helper for the root action; performs no network transfers
inputs:
  phase:
    description: prepare or finish
  operation:
    description: upload or download
  path:
    description: Upload globs or download directory
  key:
    description: Upload name or the concrete key returned by the producer
  if-no-files-found:
    description: error, warn, or ignore
    default: warn
outputs:
  path:
    description: Portable staging path for the existing cache backend
  key:
    description: Concrete run and attempt key
  ready:
    description: Whether files were prepared
runs:
  using: node24
  main: dist/index.js
